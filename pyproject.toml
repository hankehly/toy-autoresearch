[project]
name = "toy-autoresearch"
version = "0.1.0"
description = "The smallest working version of an agent research loop, with guards against overfitting."
requires-python = ">=3.12"
dependencies = [
    # The same versions the sandboxes install (the Dockerfiles in docker/agent-sandbox and
    # docker/model-sandbox), so the Mac and the sandboxes do the same arithmetic. Change all
    # three files together.
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pyarrow==26.0.1",  # reads and writes the data store's Parquet files
    # Only the simulations use scipy (scripts/night_sim.py; bundle_sim.py imports it).
    "scipy==1.15.2",
    # loop.py checks the agent's structured reply against its schema with this.
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    # Runs the tests: `uv run pytest`.
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]        # `uv run pytest` runs every test in tests/
pythonpath = [".", "judge"]  # so a test file can `import loop`, `import store` and `import judge`
