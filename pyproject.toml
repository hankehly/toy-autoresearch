[project]
name = "toy-autoresearch"
version = "0.1.0"
description = "The smallest working version of an agent research loop, with guards against overfitting."
requires-python = ">=3.12"
dependencies = [
    # The same versions the sandboxes install (the Dockerfiles in docker/agent-sandbox and
    # docker/model-sandbox), so the Mac and the sandboxes do the same arithmetic. Change all
    # three files together.
    "numpy==2.2.3",
    "pandas==2.2.3",
    # Only the simulations use scipy (scripts/night_sim.py; bundle_sim.py imports it).
    "scipy==1.15.2",
]
