[project]
name = "toy-autoresearch"
version = "0.1.0"
description = "The smallest working version of an agent research loop, with guards against overfitting."
requires-python = ">=3.12"
dependencies = [
    # The same versions the rooms install (rooms/agent-room and rooms/model-room Dockerfiles),
    # so the Mac and the rooms do the same arithmetic. Change all three files together.
    "numpy==2.2.3",
    "pandas==2.2.3",
    # Only the simulations use scipy (scripts/night_sim.py; bundle_sim.py imports it).
    "scipy==1.15.2",
]
