[project]
name = "toy-autoresearch"
version = "0.1.0"
description = "The smallest working version of an agent research loop, with guards against overfitting."
requires-python = ">=3.12"
dependencies = [
    # The same versions the sandboxes install (the Dockerfiles in docker/agent-sandbox and
    # docker/model-sandbox), so the Mac and the sandboxes do the same arithmetic. Change all
    # three files together.
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pyarrow==26.0.1",  # reads and writes the data store's Parquet files
    # Only the simulations use scipy (scripts/night_sim.py; bundle_sim.py imports it).
    "scipy==1.15.2",
    # loop.py checks the agent's structured reply against its schema with this.
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pandas-stubs~=2.2.3",
    "pyright>=1.1.414",
    # Runs the tests: `uv run pytest`.
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "zizmor>=1.33.1",
]

[tool.pyright]
# Pyright reads the code without running it and reports a value used as the wrong type: a
# number treated as a table, something that may be None used as if it never were.
include = ["loop.py", "store.py", "judge", "lab", "docker", "scripts", "tests"]
exclude = ["lab/model.py"]  # the agent writes it (as with ruff, above)
# The folders whose files import each other by bare name (`import store`, `import model`).
extraPaths = ["judge", "lab", "scripts", "docker/model-sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]        # `uv run pytest` runs every test in tests/
pythonpath = [".", "judge"]  # so a test file can `import loop`, `import store` and `import judge`

[tool.ruff]
line-length = 100
# Code the agent wrote, not a human: the champion and every turn's model. The agent's code
# is judged on its score, not its style, so a kept idea must never fail a style check.
extend-exclude = ["lab/model.py", "history"]
# The folders whose files import each other by bare name (`import store`, `import model`).
src = [".", "judge", "lab", "scripts"]

[tool.ruff.lint]
select = [
    "F", "E4", "E7", "E9",  # mistakes: unused imports, undefined names, broken syntax
    "B", "PLE", "PLW",      # likely bugs
    "SIM", "C4", "RUF",     # simpler ways to write the same thing
    "PD", "NPY",            # pandas and numpy habits that are out of date
    "I",                    # imports in one order
    "UP",                   # `list` not `List`, `X | None` not `Optional[X]`
    "ANN2",                 # a return type on every function
    "D",                    # docstrings: every function has one, laid out the NumPy way
]
ignore = [
    # `subprocess.run` without `check=`: the loop and the tests read the return code themselves.
    "PLW1510",
    # `dict(turn=turn, kept=kept)`: with many keys it reads more easily than the same in braces.
    "C408",
    # A docstring's first line as a command ("Return the rows"): ours often name the thing
    # returned instead ("The rows of the full ledger."), which reads just as well.
    "D401",
]

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks, and it returns nothing.
"tests/*" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # sections named Parameters, Returns and Raises, each underlined
